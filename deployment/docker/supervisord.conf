[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:pretalxweb]
command=/usr/local/bin/pretalx webworker
autostart=true
autorestart=true
priority=5
user=pretalxuser
environment=HOME=/pretalx
; Pass the worker's output through to the container's stdout/stderr (so it
; shows in `docker logs`) instead of supervisord's files under /tmp
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pretalxtask]
command=/usr/local/bin/pretalx taskworker
autostart=true
autorestart=true
priority=5
user=pretalxuser
; Pass the worker's output through to the container's stdout/stderr (so it
; shows in `docker logs`) instead of supervisord's files under /tmp
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
